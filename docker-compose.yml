services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LIPILA_API_URL: ${LIPILA_API_URL:-https://api.lipila.com/v1}
      LIPILA_API_KEY: ${LIPILA_API_KEY}
      LIPILA_WEBHOOK_SECRET: ${LIPILA_WEBHOOK_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ALLOW_MOCK_MODE: "false"
      APP_VERSION: ${APP_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
